name: Release

# Publishes the NuGet packages and a GitHub release when a version tag is pushed.
# The tag is the version: v5.0.0 packs 5.0.0, and v5.0.0-rc.1 packs 5.0.0-rc.1 (a prerelease).
# The tagged commit must be on v5/main.
on:
  push:
    tags: ['v*']

# Jobs that run the repository's code only read it. The publish job asks for more.
permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  # Runs repository code (npm and MSBuild scripts, tests), so it holds a read-only token.
  build:
    name: Validate, build, test and pack
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the tagged commit is on v5/main
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags origin v5/main
          if ! git merge-base --is-ancestor "$SHA" origin/v5/main; then
            echo "Refusing to release $TAG: its commit $SHA is not on v5/main. Merge it to v5/main first, then tag again."
            exit 1
          fi
      - name: Read the version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "The tag '$TAG' is not a version such as v5.0.0 or v5.0.0-rc.1."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            src/Formulate.BackOffice/Client/package-lock.json
            src/Formulate.Extensions.PlainJavaScriptTemplate/Client/package-lock.json
      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet build src/Formulate.sln -c Release -p:Version="$VERSION"
      - name: Test
        run: dotnet test src/Formulate.sln -c Release --no-build
      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet pack src/Formulate.sln -c Release --no-build -p:Version="$VERSION" -o artifacts/packages
      - name: List the packages
        run: ls -l artifacts/packages
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          retention-days: 14

  # Runs no repository code: it only moves the packed files to NuGet and to a GitHub release.
  publish:
    name: Push to NuGet and create the release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts/packages
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: >-
          dotnet nuget push "artifacts/packages/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          flags=(--verify-tag --generate-notes --title "Formulate $VERSION")
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" artifacts/packages/*.nupkg "${flags[@]}"
